<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" id="viewPort" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Pigment</title>
    <style>
      html,
      body {
        overflow: hidden;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #16120f;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      #canvas {
        position: fixed;
        top: 0;
        left: 0;
        outline: none;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      #loading {
        position: absolute;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #16120f;
        color: #f4ead7;
        font-family: Palatino, Georgia, serif;
        font-size: 2rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
    <!--pl:head-->
  </head>

  <body id="body1">
    <canvas id="canvas"></canvas>
    <div id="loading">Pigment</div>
    <!--pl:body-->
  </body>
</html>
